name: Build Android Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-main
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build and publish release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing secret: ANDROID_KEYSTORE_BASE64" >&2; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing secret: ANDROID_KEYSTORE_PASSWORD" >&2; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing secret: ANDROID_KEY_ALIAS" >&2; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing secret: ANDROID_KEY_PASSWORD" >&2; exit 1; }

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.jks

      - name: Read app version
        id: version
        run: |
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -n 1)"
          if [ -z "$VERSION_NAME" ]; then
            echo "Unable to read versionName from app/build.gradle." >&2
            exit 1
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDesktopRelease --console=plain --stacktrace

      - name: Prepare release asset
        id: asset
        run: |
          APK_PATH="$(find app/build/outputs/apk/desktop/release -name '*.apk' ! -name '*unsigned*' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "No signed release APK was generated." >&2
            exit 1
          fi

          ASSET_NAME="Lightwell-v${{ steps.version.outputs.version_name }}.apk"
          cp "$APK_PATH" "$ASSET_NAME"

          {
            echo "asset_name=$ASSET_NAME"
            echo "asset_path=$ASSET_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Write release notes
        run: |
          printf 'Lightwell v%s\n\nAutomated release APK build from main.\n\nCommit: %s\nWorkflow run: %s/%s/actions/runs/%s\n' \
            "${{ steps.version.outputs.version_name }}" \
            "$GITHUB_SHA" \
            "$GITHUB_SERVER_URL" \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_RUN_ID" > release-notes.md

      - name: Move version tag
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG_NAME" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG_NAME" --force

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          ASSET_PATH: ${{ steps.asset.outputs.asset_path }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --title "Lightwell v${VERSION_NAME}" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "$TAG_NAME" \
              --title "Lightwell v${VERSION_NAME}" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA" \
              --latest
          fi

          gh release upload "$TAG_NAME" "$ASSET_PATH" --clobber
